services:
  postgres:
    image: postgres:18-alpine3.23
    environment:
      POSTGRES_DB: GearUp
      POSTGRES_USER: gearup
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-GearUp_Strong!Pass123}"
    ports:
      - "5433:5432"
    volumes:
      - gearup-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gearup -d GearUp"]
      interval: 10s
      timeout: 5s
      retries: 12

  api:
    build:
      context: .
      dockerfile: src/GearUp.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__GearUpDatabase: "Host=postgres;Port=5432;Database=GearUp;Username=gearup;Password=${POSTGRES_PASSWORD:-GearUp_Strong!Pass123}"
      Jwt__Key: "${JWT_KEY:?JWT_KEY must be set}"
      Seed__AdminUser: "${SEED_ADMIN_USER}"
      Seed__AdminPassword: "${SEED_ADMIN_PASSWORD}"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  gearup-postgres-data:
