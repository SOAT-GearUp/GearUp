services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-GearUp_Strong!Pass123}"
    ports:
      - "14333:1433"
    volumes:
      - gearup-sql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P '${MSSQL_SA_PASSWORD:-GearUp_Strong!Pass123}' -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  api:
    build:
      context: .
      dockerfile: src/GearUp.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__GearUpDatabase: "Server=sqlserver,1433;Database=GearUp;User Id=sa;Password=${MSSQL_SA_PASSWORD:-GearUp_Strong!Pass123};TrustServerCertificate=True"
      Jwt__Key: "${JWT_KEY:-LOCAL-DEVELOPMENT-KEY-CHANGE-IN-PRODUCTION-2026}"
    ports:
      - "8080:8080"
    depends_on:
      sqlserver:
        condition: service_healthy

volumes:
  gearup-sql-data:
