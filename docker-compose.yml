services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: GearUp
      POSTGRES_USER: gearup
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-GearUp_Strong!Pass123}"
    ports:
      - "5433:5432"
    volumes:
      - gearup-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gearup -d GearUp"]
      interval: 10s
      timeout: 5s
      retries: 12

  api:
    build:
      context: .
      dockerfile: src/GearUp.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__GearUpDatabase: "Host=postgres;Port=5432;Database=GearUp;Username=gearup;Password=${POSTGRES_PASSWORD:-GearUp_Strong!Pass123}"
      Jwt__Key: "${JWT_KEY:-LOCAL-DEVELOPMENT-KEY-CHANGE-IN-PRODUCTION-2026}"
      Seed__AdminUser: "${SEED_ADMIN_USER}"
      Seed__AdminPassword: "${SEED_ADMIN_PASSWORD}"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  sonarqube:
    image: sonarqube:community
    container_name: sonarqube
    depends_on:
      - db
    ports:
      - "9000:9000"
    environment:
      - SONAR_JDBC_URL=jdbc:postgresql://db:5432/sonar
      - SONAR_JDBC_USERNAME=sonar
      - SONAR_JDBC_PASSWORD=sonar_password
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs

  db:
    image: postgres:16
    container_name: sonarqube_db
    environment:
      - POSTGRES_USER=sonar
      - POSTGRES_PASSWORD=sonar_password
      - POSTGRES_DB=sonar
    volumes:
      - postgres_data:/var/lib/postgresql/data
  
  sonar-init:
    image: curlimages/curl:latest
    container_name: sonar-init
    depends_on:
      - sonarqube
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "
      echo 'Waiting for SonarQube web service...';
      while ! curl -s http://sonarqube:9000/api/system/status | grep -q '\"status\":\"UP\"'; do 
        sleep 2; 
      done;
      echo 'Applying custom admin password...';
      curl -s -u admin:admin -X POST 'http://sonarqube:9000/api/users/change_password?login=admin&previousPassword=admin&password=GearUp2026!!!';
      echo 'Password initialized successfully!';
      " 

volumes:
  gearup-postgres-data:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
  postgres_data:
