services:
  otel-collector:
    environment:
      DD_API_KEY: ${DD_API_KEY:?Informe DD_API_KEY no arquivo infra/observability/datadog/.env}
      DD_SITE: ${DD_SITE:-datadoghq.com}
    volumes:
      - ./infra/observability/collector/otel-collector-config.datadog.yaml:/etc/otelcol-contrib/config.yaml:ro

  datadog-agent:
    image: gcr.io/datadoghq/agent:7
    pid: host
    environment:
      DD_API_KEY: ${DD_API_KEY:?Informe DD_API_KEY no arquivo infra/observability/datadog/.env}
      DD_SITE: ${DD_SITE:-datadoghq.com}
      DD_HOSTNAME: gearup-local
      DD_ENV: local
      DD_SERVICE: gearup-api
      DD_VERSION: 1.0.0
      DD_APM_ENABLED: "false"
      DD_LOGS_ENABLED: "false"
      DD_LOGS_CONFIG_CONTAINER_COLLECT_ALL: "false"
      DD_CONTAINER_EXCLUDE: name:datadog-agent name:otel-collector
      HOST_PROC: /proc
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    healthcheck:
      test: ["CMD", "agent", "health"]
      interval: 15s
      timeout: 10s
      retries: 5
    restart: unless-stopped
