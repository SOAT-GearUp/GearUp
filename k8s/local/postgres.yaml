apiVersion: apps/v1
kind: Deployment
metadata:
  name: gearup-postgres
  namespace: gearup
  labels:
    app: gearup-postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gearup-postgres
  template:
    metadata:
      labels:
        app: gearup-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:18-alpine3.23
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: gearup-secret
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: gearup-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gearup-secret
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 30
            periodSeconds: 20
      volumes:
        - name: postgres-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: gearup-postgres
  namespace: gearup
  labels:
    app: gearup-postgres
spec:
  type: ClusterIP
  selector:
    app: gearup-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
