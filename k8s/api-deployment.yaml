apiVersion: apps/v1
kind: Deployment
metadata:
  name: gearup-api
  namespace: gearup
  labels:
    app: gearup-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gearup-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: gearup-api
    spec:
      containers:
        - name: gearup-api
          # Tag imutável (SHA do commit) — nunca "latest" em produção.
          # O CI (.github/workflows/ci.yml) deve publicar essa imagem no registry.
          image: <registry>/gearup-api:<tag>
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: gearup-config
            - secretRef:
                name: gearup-secrets
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "512Mi"
