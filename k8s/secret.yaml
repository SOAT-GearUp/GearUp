# ---------------------------------------------------------------------------
# Secret — configuração SENSÍVEL da API, em base64 (campo `data`).
#
# ATENÇÃO: base64 é codificação, não criptografia. Este arquivo com valores
# reais NÃO deve ir para o Git. Os valores abaixo são placeholders; substitua
# antes de aplicar.
#
# Como gerar cada valor:
#
#   # connection string (o Terraform já entrega pronta e em base64)
#   cd ../infra && terraform output -raw connection_string_base64
#
#   # Linux/macOS
#   printf '%s' 'valor' | base64 -w0
#
#   # PowerShell
#   [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes('valor'))
#
#   # chave JWT aleatória (a API exige no mínimo 32 bytes)
#   openssl rand -base64 48
#
# Alternativa recomendada em produção: não versionar este arquivo e criar o
# secret pela CLI (os valores são codificados automaticamente):
#
#   kubectl create secret generic gearup-api-secret -n gearup \
#     --from-literal=connection-string="$(cd ../infra && terraform output -raw connection_string)" \
#     --from-literal=jwt-key="$(openssl rand -base64 48)" \
#     --from-literal=seed-admin-password='GearUp@123' \
#     --from-literal=postgres-password='senha_forte'
# ---------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: gearup-api-secret
  namespace: gearup
  labels:
    app.kubernetes.io/name: gearup-api
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: gearup
type: Opaque
data:
  # Host=...;Port=5432;Database=gearup;Username=gearup;Password=...;SSL Mode=Require;Trust Server Certificate=true
  # `SSL Mode=Require` é obrigatório no RDS PostgreSQL 15+ (rds.force_ssl = 1).
  connection-string: SG9zdD1TVUJTVElUVUEueHh4eHgudXMtZWFzdC0xLnJkcy5hbWF6b25hd3MuY29tO1BvcnQ9NTQzMjtEYXRhYmFzZT1nZWFydXA7VXNlcm5hbWU9Z2VhcnVwO1Bhc3N3b3JkPVNVQlNUSVRVQTtTU0wgTW9kZT1SZXF1aXJlO1RydXN0IFNlcnZlciBDZXJ0aWZpY2F0ZT10cnVl

  # Chave de assinatura dos tokens JWT (mínimo 32 bytes, senão a API não sobe).
  # decodifica para: substitua-por-uma-chave-aleatoria-de-no-minimo-32-bytes
  jwt-key: c3Vic3RpdHVhLXBvci11bWEtY2hhdmUtYWxlYXRvcmlhLWRlLW5vLW1pbmltby0zMi1ieXRlcw==

  # Senha do usuário admin criado no primeiro start (Seed__AdminPassword).
  # decodifica para: GearUp@123
  seed-admin-password: R2VhclVwQDEyMw==

  # Usada apenas pelo PostgreSQL em cluster (persistencia/statefulset.yaml).
  # Irrelevante quando o banco é o RDS.
  # decodifica para: SUBSTITUA_senha_forte_do_postgres
  postgres-password: U1VCU1RJVFVBX3NlbmhhX2ZvcnRlX2RvX3Bvc3RncmVz
