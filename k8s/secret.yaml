# TEMPLATE — não versionar com valores reais preenchidos.
#
# A connection string completa é guardada como Secret (em vez de compor host/porta em
# ConfigMap + senha em Secret) por simplicidade e por segurança-por-padrão: assim nenhuma
# parte da string de conexão fica em texto claro fora do Secret.
#
# Formas recomendadas de preencher isto sem versionar segredo em texto puro:
#
#   1) Imperativo (rápido para começar):
#      kubectl create secret generic gearup-secrets \
#        --namespace gearup \
#        --from-literal=ConnectionStrings__GearUpDatabase='Host=postgres.gearup.svc.cluster.local;Port=5432;Database=GearUp;Username=gearup;Password=<senha-forte>' \
#        --from-literal=Jwt__Key='<chave-forte-32+chars>' \
#        --from-literal=Seed__AdminPassword='<senha-forte>' \
#        --from-literal=postgres-password='<senha-forte-igual-a-da-connection-string>'
#
#   2) SealedSecrets / External Secrets Operator, quando o repositório é público/compartilhado.
#   3) Gerenciador externo (AWS Secrets Manager, Azure Key Vault, ...) via External Secrets Operator.
apiVersion: v1
kind: Secret
metadata:
  name: gearup-secrets
  namespace: gearup
type: Opaque
stringData:
  ConnectionStrings__GearUpDatabase: "Host=postgres.gearup.svc.cluster.local;Port=5432;Database=GearUp;Username=gearup;Password=CHANGE_ME"
  Jwt__Key: "CHANGE_ME_32_BYTES_MINIMUM_CHANGE_ME"
  Seed__AdminPassword: "CHANGE_ME"
  postgres-password: "CHANGE_ME"
