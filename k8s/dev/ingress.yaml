# Uso local com Minikube (addon ingress + minikube tunnel). Ver README.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gearup-ingress
  namespace: gearup-dev
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
    - host: dev.gearup.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gearup-api
                port:
                  number: 80
