# IRSA (IAM Roles for Service Accounts) — vincula esta ServiceAccount à IAM Role
# abaixo via OIDC do EKS. O SecretStore (external-secret.yaml) e o Deployment/Job
# da API usam esta ServiceAccount para autenticar no AWS Secrets Manager sem
# credencial estática no cluster.
#
# A IAM Role precisa de:
#   - Trust policy liberando o OIDC provider do cluster EKS pra este ServiceAccount
#     (system:serviceaccount:gearup-prod:gearup-api-sa)
#   - Permission policy least-privilege: secretsmanager:GetSecretValue no secret
#     gearup/prod/api (ver external-secret.yaml)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gearup-api-sa
  namespace: gearup-prod
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::<AWS_ACCOUNT_ID>:role/gearup-secrets-reader
