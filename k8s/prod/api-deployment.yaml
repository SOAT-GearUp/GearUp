apiVersion: apps/v1
kind: Deployment
metadata:
  name: gearup-api
  namespace: gearup-prod
  labels:
    app: gearup-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gearup-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: gearup-api
    spec:
      serviceAccountName: gearup-api-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gearup-api
          # Tag imutável (SHA do commit) — nunca "latest" em produção.
          # O CI/CD deve publicar essa imagem no ECR antes do deploy.
          image: <ECR_URI>/gearup-api:<tag>
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: false # Kestrel/ASP.NET Core grava em /tmp por padrão
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: gearup-config
            - secretRef:
                name: gearup-secrets
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "512Mi"
