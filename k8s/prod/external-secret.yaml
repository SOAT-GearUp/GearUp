# Requer o External Secrets Operator (https://external-secrets.io) instalado no cluster
# e um SecretStore/ClusterSecretStore "aws-secrets-manager" já configurado (via IAM Role/IRSA
# com permissão secretsmanager:GetSecretValue no secret referenciado abaixo).
#
# Gera o Secret `gearup-secrets` a partir do AWS Secrets Manager — nenhum valor real fica
# neste repositório. O secret no AWS Secrets Manager deve conter as chaves:
#   ConnectionStrings__GearUpDatabase (apontando para o RDS — ver ADR-002)
#   Jwt__Key
#   Seed__AdminPassword
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gearup-secrets
  namespace: gearup-prod
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: gearup-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: gearup/prod/api
