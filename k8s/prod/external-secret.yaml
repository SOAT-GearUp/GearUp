# Requer o External Secrets Operator (https://external-secrets.io) instalado no cluster.
#
# SecretStore namespaced (não ClusterSecretStore) que autentica no AWS Secrets Manager
# via IRSA, usando a ServiceAccount gearup-api-sa (ver serviceaccount.yaml) — sem
# credencial estática no cluster.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: aws-secrets-manager
  namespace: gearup-prod
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1 # TODO: ajustar pra região real do Secrets Manager
      auth:
        jwt:
          serviceAccountRef:
            name: gearup-api-sa

---
# Gera o Secret `gearup-secrets` a partir do AWS Secrets Manager — nenhum valor real fica
# neste repositório. O secret no AWS Secrets Manager deve conter as chaves:
#   ConnectionStrings__GearUpDatabase (apontando para o RDS — ver ADR-002)
#   Jwt__Key
#   Seed__AdminPassword
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gearup-secrets
  namespace: gearup-prod
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: gearup-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: gearup/prod/api
