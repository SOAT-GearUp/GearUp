# Requer o AWS Load Balancer Controller (https://kubernetes-sigs.github.io/aws-load-balancer-controller/)
# instalado no cluster EKS. Ajuste certificate-arn, load-balancer-name e host
# conforme o cluster real de produção.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gearup-ingress
  namespace: gearup-prod
  annotations:
    kubernetes.io/ingress.class: "alb"
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS": 443}, {"HTTP": 80}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/certificate-arn: "<ACM_CERTIFICATE_ARN>"
    alb.ingress.kubernetes.io/healthcheck-path: /health/ready
    alb.ingress.kubernetes.io/load-balancer-name: gearup-prod
spec:
  rules:
    - host: gearup.example.com # TODO: trocar pelo domínio real de produção
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gearup-api
                port:
                  number: 80
