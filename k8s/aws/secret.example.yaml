apiVersion: v1
kind: Secret
metadata:
  name: gearup-secret
  namespace: gearup
type: Opaque
stringData:
  Jwt__Key: change-me-with-a-secure-key-at-least-32-bytes
  Seed__AdminPassword: change-me
  ConnectionStrings__GearUpDatabase: Host=gearup-rds-endpoint.amazonaws.com;Port=5432;Database=GearUp;Username=gearup;Password=change-me
