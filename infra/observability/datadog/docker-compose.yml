name: gearup-observability

services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.154.0
    container_name: gearup-otel-collector
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    environment:
      DD_API_KEY: ${DD_API_KEY:?Informe DD_API_KEY no arquivo .env}
      DD_SITE: ${DD_SITE:-datadoghq.com}
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
      - "127.0.0.1:13133:13133"
    volumes:
      - ../collector/otel-collector-config.datadog.yaml:/etc/otelcol-contrib/config.yaml:ro
    restart: unless-stopped

  datadog-agent:
    image: gcr.io/datadoghq/agent:7
    container_name: gearup-datadog-agent
    pid: host
    environment:
      DD_API_KEY: ${DD_API_KEY:?Informe DD_API_KEY no arquivo .env}
      DD_SITE: ${DD_SITE:-datadoghq.com}
      DD_HOSTNAME: gearup-local
      DD_ENV: local
      DD_SERVICE: gearup-api
      DD_VERSION: 1.0.0
      DD_APM_ENABLED: "false"
      DD_LOGS_ENABLED: "false"
      DD_LOGS_CONFIG_CONTAINER_COLLECT_ALL: "false"
      DD_CONTAINER_EXCLUDE: name:gearup-datadog-agent name:gearup-otel-collector
      HOST_PROC: /proc
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    healthcheck:
      test: ["CMD", "agent", "health"]
      interval: 15s
      timeout: 10s
      retries: 5
    restart: unless-stopped
